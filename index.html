<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arithmetic Game</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:28px 16px;font:16px Arial,sans-serif;color:#111;background:#fff}.card{width:min(100%,620px);margin:auto;padding:22px 28px 28px;background:#e9e9e9}h1{margin:0 0 18px;font-size:30px}.intro{line-height:1.4;margin:0 0 12px}.operation{display:block;margin:14px 0}.operation small,.range{display:block;margin:5px 0 0 24px}.range input{width:43px;padding:3px;font:inherit}.duration{display:flex;align-items:center;gap:8px;margin-top:20px}button{font:inherit;cursor:pointer;touch-action:manipulation}.primary{display:block;margin:22px 0 0 auto;padding:8px 18px;border:1px solid #777;background:#f8f8f8;border-radius:3px}.game-stats{display:flex;justify-content:space-between;font-size:18px;margin-bottom:34px}.problem{display:flex;align-items:center;justify-content:center;gap:12px;min-height:70px;font-size:clamp(30px,9vw,48px)}.problem input{width:110px;padding:2px 6px;border:2px solid #777;border-radius:3px;font:inherit;text-align:center}.feedback{height:20px;margin:10px 0 14px;text-align:center;color:#b31b1b}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;max-width:360px;margin:auto}.keypad button{min-height:58px;border:1px solid #999;border-radius:5px;background:#fafafa;font-size:25px}.utility{background:#dedede!important}.text-button{display:block;margin:18px auto 0;border:0;background:transparent;text-decoration:underline;font-size:14px}#results{text-align:center;padding:30px 0 12px}.final{font-size:20px}[hidden]{display:none!important}@media(max-width:480px){body{padding:0}.card{min-height:100vh;padding:24px 18px}.range{margin-left:0;line-height:2.2}.problem{gap:8px}.problem input{width:92px}.keypad button{min-height:62px}}
</style>
</head>
<body>
<main class="card">
<section id="setup"><h1>Arithmetic Game</h1><p class="intro">Solve as many arithmetic problems as you can before time runs out.</p><p class="intro">Choose the operations and ranges you want to practice.</p>
<label class="operation"><span><input id="add" type="checkbox" checked> Addition</span><span class="range">Range: (<input id="amin" type="number" value="2"> to <input id="amax" type="number" value="100">) + (<input id="bmin" type="number" value="2"> to <input id="bmax" type="number" value="100">)</span></label>
<label class="operation"><span><input id="sub" type="checkbox" checked> Subtraction</span><small>Addition problems in reverse.</small></label>
<label class="operation"><span><input id="mul" type="checkbox" checked> Multiplication</span><span class="range">Range: (<input id="mmin" type="number" value="2"> to <input id="mmax" type="number" value="12">) × (<input id="nmin" type="number" value="2"> to <input id="nmax" type="number" value="100">)</span></label>
<label class="operation"><span><input id="div" type="checkbox" checked> Division</span><small>Multiplication problems in reverse.</small></label>
<label class="duration">Duration: <select id="duration"><option value="30">30 seconds</option><option value="60">60 seconds</option><option value="120" selected>120 seconds</option><option value="300">300 seconds</option><option value="600">600 seconds</option></select></label>
<p id="setupFeedback" class="feedback"></p><button id="start" class="primary">Start</button></section>
<section id="game" hidden><div class="game-stats"><span>Seconds left: <strong id="time">120</strong></span><span>Score: <strong id="score">0</strong></span></div><div class="problem"><span id="question"></span><span>=</span><input id="answer" inputmode="numeric" autocomplete="off"></div><p id="feedback" class="feedback"></p><div class="keypad"><button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button><button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button><button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button><button data-k="back" class="utility">⌫</button><button data-k="0">0</button><button data-k="enter" class="utility">↵</button></div><button id="quit" class="text-button">End game</button></section>
<section id="results" hidden><h1>Time’s up!</h1><p class="final">You solved <strong id="finalScore">0</strong> problems.</p><p id="best"></p><button id="again" class="primary">Play again</button></section>
</main>
<script>
const $=id=>document.getElementById(id),screens=[$("setup"),$("game"),$("results")];let score=0,seconds=0,timer,question;
function show(s){screens.forEach(x=>x.hidden=x!==s)}function num(id){return Number($(id).value)||0}function rand(a,b){a=Math.min(a,b);b=Math.max(a,b);return Math.floor(Math.random()*(b-a+1))+a}
function make(){let kinds=[];if($("add").checked||$("sub").checked)kinds.push("a");if($("mul").checked||$("div").checked)kinds.push("m");if(!kinds.length)return null;let k=kinds[Math.floor(Math.random()*kinds.length)];if(k==="a"){let a=rand(num("amin"),num("amax")),b=rand(num("bmin"),num("bmax"));if($("sub").checked&&(!$("add").checked||Math.random()<.5))return{text:`${a+b} − ${a}`,answer:b};return{text:`${a} + ${b}`,answer:a+b}}let a=rand(num("mmin"),num("mmax")),b=rand(num("nmin"),num("nmax"));if($("div").checked&&(!$("mul").checked||Math.random()<.5))return{text:`${a*b} ÷ ${a}`,answer:b};return{text:`${a} × ${b}`,answer:a*b}}
function next(){question=make();$("question").textContent=question.text;$("answer").value="";$("answer").focus()}function submit(){if(!question||!$("answer").value)return;if(Number($("answer").value)===question.answer){score++;$("score").textContent=score;$("feedback").textContent="";next()}else{$("feedback").textContent="Try again";$("answer").select()}}
function finish(){clearInterval(timer);$("finalScore").textContent=score;let best=Math.max(score,Number(localStorage.bestArithmetic||0));localStorage.bestArithmetic=best;$("best").textContent=`Best score: ${best}`;show($("results"))}
$("start").onclick=()=>{if(!$("add").checked&&!$("sub").checked&&!$("mul").checked&&!$("div").checked){$("setupFeedback").textContent="Choose at least one operation";return}score=0;seconds=Number($("duration").value);$("score").textContent=0;$("time").textContent=seconds;show($("game"));next();timer=setInterval(()=>{seconds--;$("time").textContent=seconds;if(seconds<=0)finish()},1000)};$("quit").onclick=finish;$("again").onclick=()=>show($("setup"));$("answer").onkeydown=e=>{if(e.key==="Enter")submit()};document.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{let k=b.dataset.k;if(k==="enter")submit();else if(k==="back")$("answer").value=$("answer").value.slice(0,-1);else $("answer").value+=k;$("answer").focus()});
</script>
</body>
</html>
